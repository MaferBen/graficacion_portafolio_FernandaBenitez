<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Solar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="espacio">
    <!-- Sol -->
    <div class="sol"></div>

    <!-- Órbitas (Círculos punteados) -->
    <div class="orbita o1"></div>
    <div class="orbita o2"></div>
    <div class="orbita o3"></div>
    <div class="orbita o4"></div>
    <div class="orbita o5"></div>
    <div class="orbita o6"></div>
    <div class="orbita o7"></div>
    <div class="orbita o8"></div>

    <!-- Planetas y sus nombres -->
    <div class="planeta p-mercurio">
      <div class="circulo-mercurio"></div>
      <p>Mercurio</p>
    </div>

    <div class="planeta p-venus">
      <div class="circulo-venus"></div>
      <p>Venus</p>
    </div>

    <div class="planeta p-tierra">
      <div class="circulo-tierra"></div>
      <p>Tierra</p>
    </div>

    <div class="planeta p-marte">
      <div class="circulo-marte"></div>
      <p>Marte</p>
    </div>

    <div class="planeta p-jupiter">
      <div class="circulo-jupiter"></div>
      <p>Júpiter</p>
    </div>

    <div class="planeta p-saturno">
      <div class="circulo-saturno">
        <div class="anillo"></div>
      </div>
      <p>Saturno</p>
    </div>

    <div class="planeta p-urano">
      <div class="circulo-urano"></div>
      <p>Urano</p>
    </div>

    <div class="planeta p-neptuno">
      <div class="circulo-neptuno"></div>
      <p>Neptuno</p>
    </div>
  </div>

</body>
</html>
